[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "html-catalog-demo"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
